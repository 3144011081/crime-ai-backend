name: Backend CI (Python Monoserver Test)

on:
  push:
    paths:
      - 'backend/**'
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Test Flask API & Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system packages for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1-mesa-glx libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Monoserver Factory & Endpoints
        run: |
          python -c "
          from backend.monoserver import create_app
          app = create_app()
          client = app.test_client()
          
          # Test endpoints
          r1 = client.get('/api/videos')
          assert r1.status_code == 200, f'Videos endpoint failed: {r1.status_code}'
          
          r2 = client.get('/api/reports')
          assert r2.status_code == 200, f'Reports endpoint failed: {r2.status_code}'
          
          r3 = client.get('/api/settings')
          assert r3.status_code == 200, f'Settings endpoint failed: {r3.status_code}'
          
          print('✅ All backend API endpoints verified successfully!')
          "
